  <script>
    const data = JSON.parse(document.getElementById("spend-data").textContent);
    const COLORS = ["#1f4b6e","#e07a3d","#c44536","#2f7c78","#2f6b4f","#c4962c","#7a5ea7","#d4768a","#8c6239","#7f8c99","#b85c8a","#5c5346"];
    const pieColors = data.pie.map((_, i) => COLORS[i % COLORS.length]);
    const catColor = data.categories.map((cat) => {
      const slice = data.pie.findIndex((item) => item.cat === cat.i || (item.cats || []).includes(cat.i));
      return pieColors[slice] || COLORS[COLORS.length - 1];
    });

    const qInput = document.getElementById("q");
    const resetBtn = document.getElementById("reset");
    const listEl = document.getElementById("list");
    const emptyEl = document.getElementById("empty");
    const openCats = new Set();
    let active = null;

    function rub(value) {
      const negative = value < 0;
      const [whole, frac] = Math.abs(value).toFixed(2).split(".");
      const grouped = whole.replace(/\B(?=(\d{3})+(?!\d))/g, "\u00a0");
      return (negative ? "−" : "") + grouped + "," + frac + "\u00a0₽";
    }
    function share(value) {
      const pct = (100 * value) / data.total;
      if (pct < 0.05) return "<\u00a00,1%";
      return pct.toFixed(1).replace(".", ",") + "%";
    }
    function opsWord(count) {
      const n = Math.abs(count) % 100;
      const n1 = n % 10;
      if (n > 10 && n < 15) return "операций";
      if (n1 === 1) return "операция";
      if (n1 > 1 && n1 < 5) return "операции";
      return "операций";
    }
    function ops(count) {
      return count + "\u00a0" + opsWord(count);
    }

    document.getElementById("kicker").textContent = data.period + "  ·  счёт " + data.account;
    document.getElementById("lead").textContent = "Со счёта ушло " + rub(data.total) + ", " + ops(data.ops) + ". На круге статья стоит отдельно, если на неё пришлось от 1% суммы. Ниже все имена и названия так, как они записаны в выгрузке.";
    document.getElementById("foot").textContent = "В файле суммы со знаком минус: это расход. Здесь они показаны как потраченные деньги. " + data.aside;

    function polar(cx, cy, r, angle) {
      return [cx + r * Math.cos(angle), cy + r * Math.sin(angle)];
    }
    function ring(cx, cy, r, a0, a1, sweep) {
      const [x0, y0] = polar(cx, cy, r, a0);
      const [x1, y1] = polar(cx, cy, r, a1);
      const large = Math.abs(a1 - a0) > Math.PI ? 1 : 0;
      return "M " + x0 + " " + y0 + " A " + r + " " + r + " 0 " + large + " " + sweep + " " + x1 + " " + y1;
    }
    function slicePath(cx, cy, r, ir, a0, a1) {
      const [ix, iy] = polar(cx, cy, ir, a1);
      return ring(cx, cy, r, a0, a1, 1) + " L " + ix + " " + iy + " " + ring(cx, cy, ir, a1, a0, 0).replace(/^M\s+[-\d.]+\s+[-\d.]+\s+/, "") + " Z";
    }

    const svg = document.getElementById("pie");
    const cx = 160;
    const cy = 160;
    let angle = -Math.PI / 2;
    data.pie.forEach((item, index) => {
      const sweep = (item.sum / data.total) * Math.PI * 2;
      const pad = sweep > 0.08 ? 0.012 : 0;
      const a0 = angle + pad;
      const a1 = angle + sweep - pad;
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", slicePath(cx, cy, 142, 78, a0, a1));
      path.setAttribute("fill", pieColors[index]);
      path.dataset.index = String(index);
      const title = document.createElementNS("http://www.w3.org/2000/svg", "title");
      title.textContent = item.name + ": " + rub(item.sum) + ", " + share(item.sum);
      path.appendChild(title);
      path.addEventListener("click", () => toggle(index));
      svg.appendChild(path);
      if (item.sum / data.total >= 0.07) {
        const mid = angle + sweep / 2;
        const [x, y] = polar(cx, cy, 110, mid);
        const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
        label.setAttribute("x", x);
        label.setAttribute("y", y);
        label.setAttribute("text-anchor", "middle");
        label.setAttribute("dominant-baseline", "middle");
        label.setAttribute("fill", "#ffffff");
        label.setAttribute("font-size", "15");
        label.setAttribute("font-family", "Arial, sans-serif");
        label.setAttribute("font-weight", "700");
        label.setAttribute("pointer-events", "none");
        label.textContent = share(item.sum);
        svg.appendChild(label);
      }
      angle += sweep;
    });
    const hole = document.createElementNS("http://www.w3.org/2000/svg", "text");
    hole.setAttribute("x", cx);
    hole.setAttribute("y", cy + 1);
    hole.setAttribute("text-anchor", "middle");
    hole.setAttribute("dominant-baseline", "middle");
    hole.setAttribute("fill", "#1c1915");
    hole.setAttribute("font-size", "14");
    hole.setAttribute("font-family", "Arial, sans-serif");
    hole.setAttribute("font-weight", "700");
    hole.textContent = rub(data.total).replace("\u00a0₽", "");
    svg.appendChild(hole);

    const legend = document.getElementById("legend");
    data.pie.forEach((item, index) => {
      const li = document.createElement("li");
      const button = document.createElement("button");
      button.type = "button";
      button.addEventListener("click", () => toggle(index));
      const sw = document.createElement("span");
      sw.className = "swatch";
      sw.style.background = pieColors[index];
      const name = document.createElement("span");
      name.className = "name";
      name.textContent = item.name;
      const money = document.createElement("span");
      money.className = "meta money";
      money.textContent = rub(item.sum);
      const meta = document.createElement("span");
      meta.className = "meta pct";
      meta.textContent = share(item.sum);
      button.append(sw, name, money, meta);
      li.appendChild(button);
      legend.appendChild(li);
    });

    function matches(cat, query) {
      if (!query) return true;
      const hay = [cat.name, ...cat.people.flatMap((person) => [person.name, ...person.notes])].join(" ").toLowerCase();
      return hay.includes(query);
    }
    function peopleMatching(cat, query) {
      if (!query) return cat.people;
      return cat.people.filter((person) => (person.name + " " + person.notes.join(" ") + " " + cat.name).toLowerCase().includes(query));
    }
    function selectedIndexes() {
      if (active === null) return null;
      const item = data.pie[active];
      return item.cats ? item.cats : [item.cat];
    }
    function render() {
      const query = qInput.value.trim().toLowerCase();
      const picked = selectedIndexes();
      listEl.textContent = "";
      let shown = 0;
      data.categories.forEach((cat) => {
        if (picked && !picked.includes(cat.i)) return;
        if (!matches(cat, query)) return;
        const people = peopleMatching(cat, query);
        if (!people.length) return;
        shown += 1;
        const opened = openCats.has(cat.i);
        const section = document.createElement("section");
        section.className = "cat" + (opened ? " is-open" : "");
        section.style.setProperty("--c", catColor[cat.i]);
        section.id = "cat-" + cat.i;
        const head = document.createElement("div");
        head.className = "cat-head";
        head.tabIndex = 0;
        head.setAttribute("role", "button");
        head.setAttribute("aria-expanded", opened ? "true" : "false");
        head.setAttribute("aria-label", cat.name + (opened ? ", свернуть" : ", развернуть"));
        const mark = document.createElement("span");
        mark.className = "plus";
        mark.setAttribute("aria-hidden", "true");
        mark.textContent = opened ? "−" : "+";
        const title = document.createElement("h3");
        title.textContent = cat.name;
        const sum = document.createElement("p");
        sum.className = "sum";
        sum.textContent = rub(cat.sum);
        const sub = document.createElement("p");
        sub.className = "sub";
        sub.textContent = ops(cat.count) + "  ·  " + share(cat.sum);
        head.append(mark, title, sum, sub);
        head.addEventListener("click", () => toggleCat(cat.i));
        head.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            toggleCat(cat.i);
          }
        });
        const payees = document.createElement("div");
        payees.className = "payees";
        payees.hidden = !opened;
        const max = Math.max(...people.map((person) => person.sum));
        people.forEach((person) => {
          const row = document.createElement("div");
          row.className = "payee";
          const who = document.createElement("p");
          who.className = "who";
          who.textContent = person.name;
          const amount = document.createElement("p");
          amount.className = "sum";
          amount.textContent = rub(person.sum);
          const meta = document.createElement("p");
          meta.className = "note";
          const bits = [ops(person.count)];
          if (person.pending) bits.push(rub(person.pending) + " ещё в обработке");
          if (person.notes.length) bits.push("в сообщении: " + person.notes.join("; "));
          meta.textContent = bits.join("  ·  ");
          const bar = document.createElement("div");
          bar.className = "bar";
          const fill = document.createElement("span");
          fill.style.width = Math.max(2, (person.sum / max) * 100) + "%";
          bar.appendChild(fill);
          row.append(who, amount, meta, bar);
          payees.appendChild(row);
        });
        section.append(head, payees);
        listEl.appendChild(section);
      });
      emptyEl.hidden = shown !== 0;
      resetBtn.hidden = active === null && !query;
      legend.querySelectorAll("button").forEach((button, index) => {
        button.classList.toggle("is-on", index === active);
      });
      svg.querySelectorAll("path").forEach((path) => {
        path.classList.toggle("is-dim", active !== null && Number(path.dataset.index) !== active);
      });
    }
    function toggleCat(id) {
      if (openCats.has(id)) openCats.delete(id);
      else openCats.add(id);
      render();
    }
    function reveal(ids) {
      ids.forEach((id) => openCats.add(id));
    }
    function toggle(index) {
      active = active === index ? null : index;
      if (active !== null) {
        const item = data.pie[active];
        reveal(item.cats || [item.cat]);
      }
      render();
      if (active !== null) {
        const first = listEl.querySelector(".cat");
        if (first) first.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    }
    qInput.addEventListener("input", () => {
      const query = qInput.value.trim().toLowerCase();
      if (query) {
        reveal(data.categories.filter((cat) => matches(cat, query)).map((cat) => cat.i));
      }
      render();
    });
    resetBtn.addEventListener("click", () => {
      active = null;
      qInput.value = "";
      openCats.clear();
      render();
    });
    render();
  </script>
